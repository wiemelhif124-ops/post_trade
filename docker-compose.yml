services:
  postgres:
    image: postgres:16-alpine
    container_name: posttrade-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:  ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_ro -d posttrade"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: posttrade-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: posttrade-backend
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      DB_URL: postgresql+psycopg2://agent_ro:agent_ro_pwd@postgres:5432/posttrade
      OLLAMA_HOST: http://ollama:11434
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: posttrade-frontend
    ports:
      - "8501:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data: